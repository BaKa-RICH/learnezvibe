objective: '收集本周数据: 本周数据仅指冻结输入 b3-weekly-fixture-v1。四个冻结文件已作为附件附在根 issue 上(见上游 source_issues):
  交接信-新session.md、项目总纲-Multica工作流引擎.md、Evidence/B1卡点清单.md、Evidence/B2验收记录.md。请从根 issue
  附件下载这 4 个文件、核对 SHA-256 与 frozen-input.json 一致后, 汇总成 3-5 条要点写入 weekly-data.md; 不得使用仓库/workdir
  中的同名文件, 不得使用动态网页。'
non_goals:
- 不要修改仓库里除 weekly-data.md 以外的其他文件
- 不要撰写周报正文(那是 write 节点的职责)
verification_commands:
- python -c "import os,sys;sys.exit(0 if os.path.exists('weekly-data.md') and os.path.getsize('weekly-data.md')>0
  else 1)"
- python -c "import sys;c=open('weekly-data.md',encoding='utf-8').read().strip().splitlines();sys.exit(0
  if len(c)>=3 else 1)"
integration_gates:
- name: gate1
  layer: L1
  delivery_goal: 本周数据已汇总到 weekly-data.md
  source_of_truth:
  - weekly-data.md
  covers:
  - data
  acceptance_refs:
  - weekly-data.md 存在且内容非空、至少含 3 条要点
  commands:
  - python -c "import os,sys;sys.exit(0 if os.path.exists('weekly-data.md') and os.path.getsize('weekly-data.md')>0
    else 1)"
  required_metrics: {}
  artifacts:
  - weekly-data.md
pr_base: null
acceptance:
- weekly-data.md 存在且内容非空
- weekly-data.md 至少包含 3 条本周要点
delivery_mode: content
source_of_truth:
- weekly-data.md
